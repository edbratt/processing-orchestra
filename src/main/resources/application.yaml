server:
  port: 8080
  host: "127.0.0.1"
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/static"
          welcome: "index.html"

processing:
  sketch-class: "com.processing.server.ProcessingSketch"
  width: 800
  height: 600
  fps: 60

output:
  mode: "sketch"

osc:
  default-stream: "spiral-main"
  streams: "spiral-main,gravity-orbit,vectorscope"
  host: "127.0.0.1"
  walker-port: 12000
  vectorscope-port: 12001
  mirror-vectorscope: true
  fps: 60
  debug:
    logging: false
    sample-limit: 100
  pitch:
    enabled: true
    detector: "yin"
    min-level: 0.035
    min-confidence: 0.18
    min-frequency-hz: 65
    max-frequency-hz: 1600
    yin-threshold: 0.12
    emit-interval-ms: 250
    note-switch-streak: 2
    smoothing-alpha: 0.35
  stream:
    spiral-main:
      host: "127.0.0.1"
      port: 12000
      contract: "walker-trigger"
    gravity-orbit:
      host: "127.0.0.1"
      port: 12002
      contract: "orchestra-session-v1"
    vectorscope:
      host: "127.0.0.1"
      port: 12001
      contract: "walker-monitor"
      mirror-source: "spiral-main"

audio:
  mode: "high-quality-mono"
  debug:
    logging: false
    sample-limit: 5
  modes:
    high-quality-stereo:
      sample-rate: 44100
      channels: 2
      description: "44.1kHz Stereo - Best quality, highest bandwidth"
    high-quality-mono:
      sample-rate: 44100
      channels: 1
      description: "44.1kHz Mono - Good quality, moderate bandwidth"
    voice:
      sample-rate: 22050
      channels: 1
      description: "22.05kHz Mono - Voice quality, low bandwidth"
  buffer-size: 2048
  max-buffer-chunks: 20

motion:
  update-hz: 20
  clamp:
    alpha-degrees: 180
    beta-degrees: 60
    gamma-degrees: 60
    acceleration-g: 3.0
    magnitude-g: 4.0
  mapping:
    tilt-offset-normalized: 0.12
    shake-threshold-g: 0.2
    shake-burst-scale: 1.8
  debug:
    logging: false
    sample-limit: 5

debug:
  logging: false
